<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and morty multiverse</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="main-header">
        <h1 class="app-tittle">Rick and morty multiverse</h1>

        <!--Menu de navegacion principal-->
        <nav class="nav-bar">
            <button id="btnCharacters" class="nav-btn">Characters</button>
            <button id="btnLocations" class="nav-btn">Locations</button>
            <button id="btnEpisodes" class="nav-btn">Episodes</button>
            <button id="btnFavorites" class="nav-btn btn-special">⭐ My Favorites</button>
        </nav>
    </header>

    <main class="main-content">
        <!--Contenedor dinámico donde inyectaremos los datos-->
        <div id="dataContainer" class="grid-container">
            <p class="loading-text">Welcome! Select a category above </p>
        </div>
    </main>

    <!--Footer vacío que personalizaremos con JS-->
    <footer id="mainFooter" class="dynamic-footer"></footer>
</body>
</html>
